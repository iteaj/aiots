spring.application.name=BootstrapApplication
### \u5F00\u53D1\u73AF\u5883
#---
spring.config.activate.on-profile=dev
server.port=8080
server.servlet.context-path=/

### \u6B63\u5F0F\u73AF\u5883
#---
spring.config.activate.on-profile=prod
server.port=80
server.servlet.context-path=/api

#---
spring.profiles.include=framework,core,hikari
# \u4F7F\u7528maven\u914D\u7F6E\u73AF\u5883
spring.profiles.active=@profiles.active.env@

# \u9A8C\u8BC1\u7801\u7C7B\u578B
izone.web.admin.captcha-type=math
izone.web.admin.captcha-enabled=true
izone.web.admin.login-url=/core/login
# \u8BA4\u8BC1\u6210\u529F\u540E\u8DF3\u8F6C\u7684Url
izone.web.admin.success-url=/
# \u6CA1\u6709\u6743\u9650\u8BBF\u95EE\u65F6\u8DF3\u8F6C\u7684Url
izone.web.admin.unauthorized-url=/403
# \u5141\u8BB8\u7F13\u5B58(session, auth, author\u7B49)
izone.web.admin.cache-enable=true


#\u6F14\u793A\u73AF\u5883\u72B6\u6001
izb.env.demon=@izb.env.demon@