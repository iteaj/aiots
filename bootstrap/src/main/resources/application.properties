spring.application.name=BootstrapApplication
server.servlet.context-path=@bootstrap.context.path@

spring.profiles.include=framework,mybatis,gen

# \u9A8C\u8BC1\u7801\u7C7B\u578B
izone.web.admin.captcha-type=math
izone.web.admin.captcha-enabled=true
izone.web.admin.login-url=/login
# \u8BA4\u8BC1\u6210\u529F\u540E\u8DF3\u8F6C\u7684Url
izone.web.admin.success-url=/
# \u6CA1\u6709\u6743\u9650\u8BBF\u95EE\u65F6\u8DF3\u8F6C\u7684Url
izone.web.admin.unauthorized-url=/403
# \u5141\u8BB8\u7F13\u5B58\u914D\u7F6E
izone.web.admin.cache-enable=true
# \u6587\u4EF6\u4E0A\u4F20\u6839\u76EE\u5F55
izone.web.upload-root-dir=@izb.upload.root.dir@
# \u4E0A\u4F20\u7684\u6587\u4EF6\u8BBF\u95EE\u6839\u8DEF\u5F84
izone.web.upload-root-uri=/img/upload

# \u6A21\u677F\u5F15\u64CE\u914D\u7F6E
spring.thymeleaf.cache=@izb.thymeleaf.cache@

#\u6F14\u793A\u73AF\u5883\u72B6\u6001
izb.env.demon=@izb.env.demon@

mybatis-plus.type-enums-package=com.iteaj.*.enums
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.iteaj.*.entity,com.iteaj.*.dto

spring.datasource.url=@admin.jdbc.url@
spring.datasource.username=@admin.jdbc.username@
spring.datasource.password=@admin.jdbc.password@
spring.datasource.driver-class-name=@admin.jdbc.driver@
