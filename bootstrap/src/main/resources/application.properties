spring.application.name=BootstrapApplication
server.servlet.context-path=@bootstrap.context.path@

spring.profiles.include=framework,mybatis,gen

#\u6F14\u793A\u73AF\u5883\u72B6\u6001
izb.env.demon=@izb.env.demon@

mybatis-plus.global-config.db-config.table-prefix=t_
mybatis-plus.type-enums-package=com.iteaj.*.enums
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.iteaj.*.entity,com.iteaj.*.dto

spring.datasource.url=@admin.jdbc.url@
spring.datasource.username=@admin.jdbc.username@
spring.datasource.password=@admin.jdbc.password@
spring.datasource.driver-class-name=@admin.jdbc.driver@
