#####################   \u9879\u76EE\u5165\u5E93\u914D\u7F6E\u6587\u4EF6  #####################
# 1. \u6B64\u6A21\u5757\u662F\u6574\u4E2A\u9879\u76EE\u542F\u52A8\u7684\u5165\u53E3
# 2. \u5176\u4ED6\u7684\u6838\u5FC3\u901A\u7528\u914D\u7F6E\u89C1: application-framework.properties
# 3. \u6B64\u6A21\u5757\u542F\u52A8\u7684\u7AEF\u53E3\u5C06\u4F5C\u4E3Aweb\u76D1\u542C\u7AEF\u53E3

spring.application.name=PlatformApplication
server.servlet.context-path=@bootstrap.context.path@

spring.profiles.include=framework,mybatis

mybatis-plus.global-config.db-config.table-prefix=t_
mybatis-plus.type-enums-package=com.iteaj.admin.enums
mybatis-plus.mapper-locations=classpath*:/admin/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.iteaj.admin.entity,com.iteaj.admin.dto

spring.datasource.url=@admin.jdbc.url@
spring.datasource.username=@admin.jdbc.username@
spring.datasource.password=@admin.jdbc.password@
spring.datasource.driver-class-name=@admin.jdbc.driver@
