server.port=80
server.servlet.context-path=/api
framework.domain=https://vip.iteaj.com:${server.port}
framework.fileServerDomain=${framework.domain}

spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/iboot3?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai

# \u591A\u6570\u636E\u6E90
spring.datasource.dynamic.datasource.master.url=${spring.datasource.url}
spring.datasource.dynamic.datasource.master.username=${spring.datasource.username}
spring.datasource.dynamic.datasource.master.password=${spring.datasource.password}
spring.datasource.dynamic.datasource.master.driver-class-name=${spring.datasource.driver-class-name}

# redis \u76F8\u5173\u914D\u7F6E
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=10000
spring.data.redis.host=127.0.0.1

# \u6587\u4EF6\u4E0A\u4F20\u6839\u76EE\u5F55
framework.web.upload.pattern=/file/**
framework.web.upload.location=file:/home/ubuntu/model/upload
