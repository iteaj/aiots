server.port=8085
server.servlet.context-path=/
framework.domain=http://localhost:${server.port}
framework.fileServerDomain=${framework.domain}

spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
spring.datasource.url=jdbc:p6spy:mysql://127.0.0.1:3306/iboot3_meta?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
# \u591A\u6570\u636E\u6E90
spring.datasource.dynamic.datasource.master.url=${spring.datasource.url}
spring.datasource.dynamic.datasource.master.username=${spring.datasource.username}
spring.datasource.dynamic.datasource.master.password=${spring.datasource.password}
spring.datasource.dynamic.datasource.master.driver-class-name=${spring.datasource.driver-class-name}

# \u65F6\u5E8F\u6570\u636E\u5E93\u914D\u7F6E

# redis \u76F8\u5173\u914D\u7F6E
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=10000
spring.data.redis.host=192.168.20.199

# oauth2 \u76F8\u5173\u914D\u7F6E
oauth2.client.org-id=1
oauth2.client.post-id=1
oauth2.client.role-id=7

# \u6587\u4EF6\u4E0A\u4F20\u914D\u7F6E
framework.web.upload.pattern=/file/**
framework.web.upload.location=file:D:\\upload
