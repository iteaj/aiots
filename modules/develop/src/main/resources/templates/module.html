<!DOCTYPE html>
<html lang="en">
<head>
    <th:block th:include="libs :: header('代码生成表配置')"></th:block>
</head>
<body>
  <div id="ModulePage">
    <ivz-drawer-view ref="vbt" :metas="metas" :config="config"
                     :search-metas="searchMetas" placement="top" height="360">
        <template #name_t="params">
            <a @click="jumpTables(params)">{{params.value}}</a>
        </template>
    </ivz-drawer-view>
  </div>
</body>
<th:block th:include="libs :: footer"></th:block>
<script>
  let vue = new Vue({
      el: "#ModulePage",
      data: {
          metas: [
              {field: 'name', title: '模块名称', editable: true},
              {field: 'msn', title: '模块编号', type: 'select', dictType: 'sys.module'},
              {field: 'project', title: '项目名称', editable: true},
              {field: 'tablePrefix', title: '表前缀', editable: true, width: 80},
              {field: 'dbName', title: '数据库', editable: true, width: 120},
              {field: 'account', title: '数据库账号', editable: true, width: 120},
              {field: 'password', title: '数据库密码', editable: true, width: 120},
              {field: 'remark', title: '备注', width: -1},
              {field: 'action', title: '操作', type: 'action', width: 280, fixed: 'right'}
          ],
          searchMetas: [
              {field: 'msn', title: '模块编号', type: 'select', dictType: 'sys.module'},
              {field: 'name', title: '模块名称', clear: true}
          ],
          config: {
              form: {
                  column: 4
              },
              table: {
                  pagination: {}
              }
          },
      },
      created: function() { },
      methods: {
          jumpTables: function (params) {
              let row = params['row'];
              this.$nav({path: '/dev/table', query: {msn: row.msn}, refresh: true});
          }
      }
  });
</script>
</html>
