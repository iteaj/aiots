################################################################ \u4F4E\u4EE3\u7801\u751F\u6210\u5668(mybatis-plus)\u914D\u7F6E #########################################################
# \u7C7B\u58F0\u660E\u4F5C\u8005(@author iteaj)
low.code.lgc.author=iteaj
# \u751F\u6210\u4EE3\u7801\u540E\u662F\u5426\u6253\u5F00\u6587\u4EF6\u76EE\u5F55
low.code.lgc.open=false
# \u751F\u6210\u76EE\u5F55
low.code.lgc.output-dir=D:\\
low.code.lgc.active-record=false

# \u751F\u6210\u5668\u7684\u5305\u4FE1\u606F\u914D\u7F6E
low.code.lpc.module-name=core
low.code.lpc.parent=com.iteaj.msn

# \u6570\u636E\u6E90\u914D\u7F6E
low.code.ldc.db-type=mysql
low.code.ldc.url=${spring.datasource.url}
low.code.ldc.password=${spring.datasource.password}
low.code.ldc.username=${spring.datasource.username}
low.code.ldc.driver-name=${spring.datasource.driver-class-name}

# \u751F\u6210\u5668\u751F\u6210\u7B56\u7565\u914D\u7F6E
# \u8868\u524D\u7F00
low.code.lsc.table-prefix=t_
# \u662F\u5426\u5927\u5199\u547D\u540D
low.code.lsc.capital-mode=true
# \u4F7F\u7528 @RestController
low.code.lsc.rest-controller-style=true
# \u4E0B\u5212\u7EBF\u8F6C\u9A7C\u5CF0\u547D\u540D
low.code.lsc.naming=underline_to_camel
# \u5B9E\u4F53\u7C7B\u7236\u7C7B\u7684\u516C\u5171\u5B57\u6BB5
low.code.lsc.super-entity-columns=id
# \u8BBE\u7F6E\u5B9E\u4F53\u7C7B\u7684\u7236\u7C7B
low.code.lsc.super-entity-class=com.iteaj.framework.BaseEntity
# \u8BBE\u7F6E\u4E1A\u52A1\u5C42\u63A5\u53E3\u7684\u7236\u7C7B
low.code.lsc.super-service-class=com.iteaj.framework.IBaseService
# \u8BBE\u7F6E\u4E1A\u52A1\u5C42\u5B9E\u73B0\u7C7B\u7684\u7236\u7C7B
low.code.lsc.super-service-impl-class=com.iteaj.framework.BaseServiceImpl
# \u8BBE\u7F6E\u63A7\u5236\u5668\u7C7B\u7684\u7236\u7C7B
low.code.lsc.super-controller-class=com.iteaj.framework.BaseController
