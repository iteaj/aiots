    deployDir: ${user.dir}${file.separator}iboot${file.separator}le5le
---
spring:
  config:
    activate:
      on-profile: prod #正式环境
plugin:
  le5le:
    deployDir: ${user.dir}${file.separator}iboot${file.separator}le5le