    apiUrl: https://v.le5le.com/api
    accountUrl: https://account.le5le.com/api
---
spring:
  config:
    activate:
      on-profile: dev #开发环境
plugin:
  le5le:
    deployDir: ${user.home}${file.separator}iboot${file.separator}le5le
---
