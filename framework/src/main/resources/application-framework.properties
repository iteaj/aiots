############################     \u6846\u67B6\u914D\u7F6E     ################
spring.jmx.enabled=false
server.port=@bootstrap.server.port@
spring.profiles.active=@izb.profiles.active@
spring.jmx.default-domain=${spring.application.name}
spring.application.admin.jmx-name=org.springframework.boot:type=Izone,name=${spring.application.name}

# \u9A8C\u8BC1\u7801\u7C7B\u578B
izb.auth.captcha-type=math
izb.auth.captcha-enabled=true
izb.auth.type=shiro
izb.auth.login-url=/login
# \u8BA4\u8BC1\u6210\u529F\u540E\u8DF3\u8F6C\u7684Url
izb.auth.success-url=/
# \u6CA1\u6709\u6743\u9650\u8BBF\u95EE\u65F6\u8DF3\u8F6C\u7684Url
izb.auth.unauthorized-url=/403

# \u6587\u4EF6\u4E0A\u4F20\u6839\u76EE\u5F55
izb.upload-root-dir=@izb.upload.root.dir@
# \u4E0A\u4F20\u7684\u6587\u4EF6\u8BBF\u95EE\u6839\u8DEF\u5F84
izb.upload-root-uri=/img/upload

bind.type=@bind.type@

# \u6A21\u677F\u5F15\u64CE\u914D\u7F6E
spring.thymeleaf.cache=@izb.thymeleaf.cache@

# \u6587\u4EF6\u538B\u7F29\u914D\u7F6E
server.compression.enabled=@izb.compression.enabled@

########################### \u65E5\u5FD7\u76F8\u5173\u914D\u7F6E #########################
