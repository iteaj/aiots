################# mybatis-plus\u9ED8\u8BA4\u5168\u5C40\u914D\u7F6E ########################
# \u662F\u5426\u542F\u7528banner
mybatis-plus.global-config.banner=false

mybatis-plus.type-enums-package=com.iteaj.**.enums
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
#\u81EA\u52A8\u5339\u914D\u65E0\u9700as\uFF08\u6CA1\u5F00\u542F\u8FD9\u4E2A\uFF0CSQL\u9700\u8981\u5199as\uFF1A select user_id as userId\uFF09
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.select-strategy=not_empty
mybatis-plus.type-aliases-package=com.iteaj.msn.*.entity,com.iteaj.msn.*.dto
mybatis-plus.type-handlers-package=com.iteaj.framework.mybatis.handler

# Hikari\u6570\u636E\u6E90\u5168\u5C40\u914D\u7F6E
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.pool-name=IzbHikariCP
spring.datasource.hikari.validation-timeout=60000
spring.datasource.hikari.connection-timeout=10000

# \u6570\u636E\u5E93\u914D\u7F6E
spring.datasource.url=@admin.jdbc.url@
spring.datasource.username=@admin.jdbc.username@
spring.datasource.password=@admin.jdbc.password@
spring.datasource.driver-class-name=@admin.jdbc.driver@

spring.profiles=dev
