<!DOCTYPE html>
<html lang="zh">
<head>
    <th:block th:include="libs :: header('导入数据源表')"></th:block>
</head>
<body>
  <div id="ModulePage">
        <ivz-edit-view ref="vbt" :metas="metas" :config="config"
                       placement="top" height="400">
        </ivz-edit-view>
  </div>
</body>
<th:block th:include="libs :: footer"></th:block>
<script>
    let ViewType = [
        {label: 'BasicView', value: 'ivz-basic-view'},
        {label: 'EditView', value: 'ivz-edit-view'},
        {label: 'DrawerView', value: 'ivz-drawer-view'}
    ];
    let DisabledFlag = [
        {label: '', value: true},
        // {label: '否', value: false},
    ];
    let GenStatus = [
        {label: '已生成', value: '已生成'},
        {label: '未生成', value: '未生成'},
    ];
    let WriteType = [
        {label: 'xml', value: 'XML'},
        {label: 'h5', value: 'OTHER'},
        {label: 'entity', value: 'ENTITY'},
        {label: 'mapper', value: 'MAPPER'},
        {label: 'service', value: 'SERVICE'},
        {label: 'controller', value: 'CONTROLLER'},
        {label: 'serviceImpl', value: 'SERVICE_IMPL'},
    ];
  let vue = new Vue({
      el: "#ModulePage",
      data: {
          metas: [
              {field: 'name', title: '表名', width: 280
                  , disabled: true, sorter: function (a, b) {
                      return a.name.localeCompare(b.name);
                  }},
              {field: 'comment', title: '表描述', width: -1},
              {field: 'action', title: '操作', type: 'action', width: 220}

          ],
          sure: {
              metas: [
                  {field: 'writeType', title: '类型', type: 'select', data: WriteType
                      , config: {mode: 'tags', maxTagCount: 6, extra: '注: 选择的文件生成之后将覆盖原来的'}, span: [3, 20, 24]}
              ],
              saveMeta: {
                  id: 'save', url: '/dev/table/gen', callBack: function (model) {
                      return new Promise(function (resolve) {
                          vue.$http.post('/dev/table/gen', [model]).then(function (resp) {
                              vue.$msg.successNotify("覆盖文件操作", resp['IvzMsg']);
                              vue.$refs['imf'].trigger();
                          }).catch(function (reason) {
                              vue.$msg.errorNotify("覆盖文件操作", reason);
                          })
                      })
                  }
              },
              config: {  }
          },
          config: {
              table: {
                  submitType: 'entity', // 提交整个实体对象
                  selection: {fixed: 'left'},
              }
          },
      },
      created: function() {
          // 重新修改导入表功能的回调, 添加操作提醒
          this.$page.setActionMeta("import", {callBack: function (row) {
              return new Promise((resolve) => {
                  resolve({tipTitle: '确定要重新导入表配置('+row.name+")"
                      , tipContent: '此动作将会删除原来的表、表字段配置, 生成状态将重置为未生成'
                      , success: function (resp) {
                            vue.$page.query(); // 重新导入成功后的回调, 重新加载页面数据
                      }});
              })
          }});
      },
      methods: {

      }
  });
</script>
</html>
