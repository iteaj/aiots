#\u4EE3\u7801\u751F\u6210\u5230\u9879\u76EE\u65F6, \u9700\u8981\u6307\u5B9A\u7684\u9879\u76EE\u6839\u8DEF\u5F84
dev.gen.root-dir=@dev.gen.root@
#\u4EE3\u7801\u4E0D\u751F\u6210\u5230\u9879\u76EE\u65F6, \u751F\u6210\u7684\u8DEF\u5F84, \u751F\u6210\u4EE3\u7801\u540E\u9700\u8981\u81EA\u884C\u62F7\u8D1D\u5230\u9879\u76EE\u91CC\u9762
dev.gen.global.output-dir=G:\\

############ \u6570\u636E\u6E90\u914D\u7F6E ###################
dev.gen.source.db-type=MYSQL
dev.gen.source.url=@admin.jdbc.url@
dev.gen.source.username=@admin.jdbc.username@
dev.gen.source.password=@admin.jdbc.password@
dev.gen.source.driver-name=@admin.jdbc.driver@

########### \u751F\u6210\u7B56\u7565\u914D\u7F6E #################
#dev.gen.strategy.table-prefix=t_
dev.gen.strategy.capital-mode=true
dev.gen.strategy.naming=underline_to_camel
# lombok\u6CE8\u89E3\u652F\u6301
dev.gen.strategy.entity-lombok-model=true
# \u5B9E\u4F53\u5C5E\u6027\u6784\u5EFA\u8005\u6A21\u5F0F
dev.gen.strategy.entity-builder-model=true
dev.gen.strategy.entity-serial-version-uID=false
dev.gen.strategy.super-entity-class=com.iteaj.framework.BaseEntity

# \u516C\u7528\u7684\u5B9E\u4F53\u5C5E\u6027, \u4ECE\u7236\u7C7B\u7EE7\u627F\u4E0B\u6765\u7684
dev.gen.strategy.super-entity-columns=id,create_time,update_time
dev.gen.strategy.super-mapper-class=com.iteaj.util.module.mvc.orm.IBaseDao
dev.gen.strategy.super-service-class=com.iteaj.util.module.mvc.IBaseService
dev.gen.strategy.super-controller-class=com.iteaj.framework.BaseController
dev.gen.strategy.super-service-impl-class=com.iteaj.util.module.mvc.BaseServiceImpl

################## \u5305\u4FE1\u606F\u914D\u7F6E ################
dev.gen.package-config.parent=com.iteaj

#\u662F\u5426\u5728xml\u4E2D\u6DFB\u52A0\u4E8C\u7EA7\u7F13\u5B58\u914D\u7F6E
dev.gen.global.enable-cache=false
#\u5F00\u53D1\u4F5C\u8005
dev.gen.global.author=iteaj
#\u5F00\u542F swagger2 \u6A21\u5F0F(\u5982\u679C\u5F15\u5165knife4j\u63D2\u4EF6\u5C06\u81EA\u52A8\u5F00\u542F)
# dev.gen.global.swagger2=false

#\u6307\u5B9A\u751F\u6210\u7684\u4E3B\u952E\u7684ID\u7C7B\u578B
dev.gen.global.id-type=AUTO
#\u6570\u636E\u5E93\u65F6\u95F4\u7C7B\u578B \u5230 \u5B9E\u4F53\u7C7B\u65F6\u95F4\u7C7B\u578B \u5BF9\u5E94\u7B56\u7565
dev.gen.global.date-type=ONLY_DATE
#\u751F\u6210xml\u914D\u7F6E\u6587\u4EF6 ResultMap
dev.gen.global.base-result-map=true
#\u751F\u6210sql\u5217\u5217\u8868  \u6BD4\u5982: id,name,test
dev.gen.global.base-column-list=true

#\u5404\u5C42\u6587\u4EF6\u540D\u79F0\u65B9\u5F0F\uFF0C\u4F8B\u5982\uFF1A %sAction \u751F\u6210 UserAction  %s \u4E3A\u5360\u4F4D\u7B26
dev.gen.global.entity-name=%s
dev.gen.global.xml-name=%sMapper
dev.gen.global.mapper-name=I%sMapper
dev.gen.global.service-name=I%sService
dev.gen.global.controller-name=%sController
dev.gen.global.service-impl-name=%sServiceImpl

# \u4EE3\u7801\u6A21\u7248\u8DEF\u5F84
dev.gen.h5-template=/templates/gen/h5.html
dev.gen.template.xml=/templates/gen/mapper.xml
dev.gen.template.mapper=/templates/gen/mapper.java
dev.gen.template.entity=/templates/gen/entity.java
dev.gen.template.service=/templates/gen/service.java
dev.gen.template.controller=/templates/gen/controller.java
dev.gen.template.service-impl=/templates/gen/serviceImpl.java
