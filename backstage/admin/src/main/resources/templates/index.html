<script th:inline="javascript">
    var izCtxValue = [[${#request.contextPath}]]; // 当前应用上下文路径
    var izStxValue = izCtxValue; // 静态资源上下文路径
    window.ivzGlobalConfig = {
        izCtx: izCtxValue, // 访问路径的 context_path
        izStx: izStxValue, // 访问静态资源的context_path
        modUserUrl: '/core/admin/modUserInfo', // 修改用户信息
        avatarUrl: '/common/upload/avatar', // 上传用户头像
        iconUrl: '//at.alicdn.com/t/font_1174643_opyaibxik3.js' // icon链接地址, 采用阿里图标库

</script>
